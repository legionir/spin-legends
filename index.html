<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <style>
      /* Boot screen: shown until React mounts (replaces the black screen). */
      html, body { margin: 0; background: #070b14; }
      #sl-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, #10203a 0%, #070b14 70%); color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 9999; }
      #sl-boot .sl-boot-top { width: 64px; height: 64px; border-radius: 50%; border: 4px solid rgba(56, 189, 248, 0.25); border-top-color: #38bdf8; border-right-color: #facc15; animation: sl-boot-spin 0.8s linear infinite; }
      #sl-boot .sl-boot-title { font-weight: 800; letter-spacing: 0.32em; font-size: 15px; text-transform: uppercase; }
      #sl-boot .sl-boot-sub { font-size: 11px; letter-spacing: 0.18em; color: #64748b; text-transform: uppercase; }
      @keyframes sl-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #sl-boot .sl-boot-top { animation-duration: 2.4s; } }
    </style>
    <title>Spin Legends — 3D Strategic Arena Combat</title>
    <meta name="description" content="3D Physics-Driven Strategic Arena Combat with customizable mechanical spinning tops, 8 elemental abilities, 6 arenas, and tournament progression." />
    <meta property="og:title" content="Spin Legends — 3D Strategic Arena Combat" />
    <meta property="og:description" content="Build, configure, and battle customizable 3D mechanical spinning tops in physics-driven arena combat." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="sl-boot" role="status" aria-live="polite">
        <div class="sl-boot-top"></div>
        <div class="sl-boot-title">Spin Legends</div>
        <div class="sl-boot-sub">Loading arena…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
